  name: SysAid REST API
  description: >-
    REST API for managing SysAid service records (incidents, requests, problems, changes), users, assets,
    and SLAs. Authentication uses Client Credentials to mint short-lived application access tokens (default
    24h lifetime) via the /v1/application-keys endpoint.
