openapi: 3.1.0
info:
  title: SysAid REST ActionItems CIs API
  description: 'REST API for SysAid ITSM. Manage service records (incidents, requests, problems, changes), users (agents and end users), groups, companies, assets, configuration items (CIs), templates, attachments, webhooks (beta), and license manager records. Authentication uses Client Credentials to mint short-lived application access tokens. Source: https://developers.sysaid.com/'
  version: '1.0'
  contact:
    name: SysAid
    url: https://developers.sysaid.com/
servers:
- url: https://your-account.sysaidit.com
  description: SysAid tenant base URL (replace your-account)
security:
- BearerAuth: []
tags:
- name: CIs
paths:
  /getcis:
    get:
      tags:
      - CIs
      summary: List CIs
      operationId: getCis
      responses:
        '200':
          description: OK
  /createci:
    post:
      tags:
      - CIs
      summary: Create CI
      operationId: createCi
      responses:
        '201':
          description: Created
  /getcibyid:
    get:
      tags:
      - CIs
      summary: Retrieve CI by ID
      operationId: getCiById
      responses:
        '200':
          description: OK
  /updatecibyid:
    put:
      tags:
      - CIs
      summary: Update CI
      operationId: updateCiById
      responses:
        '200':
          description: OK
  /deletecibyid:
    delete:
      tags:
      - CIs
      summary: Remove CI
      operationId: deleteCiById
      responses:
        '204':
          description: Deleted
  /getcitypes:
    get:
      tags:
      - CIs
      summary: List CI types
      operationId: getCiTypes
      responses:
        '200':
          description: OK
  /getcirelationsbyid:
    get:
      tags:
      - CIs
      summary: Retrieve CI relations
      operationId: getCiRelationsById
      responses:
        '200':
          description: OK
  /createcirelation:
    post:
      tags:
      - CIs
      summary: Create CI relation
      operationId: createCiRelation
      responses:
        '201':
          description: Created
  /deletecirelation:
    delete:
      tags:
      - CIs
      summary: Remove CI relation
      operationId: deleteCiRelation
      responses:
        '204':
          description: Deleted
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'OAuth 2.0 Client Credentials grant: exchange client_id and client_secret at /generateaccesstoken for a short-lived access token (default 24h), then pass as "Authorization: Bearer <token>".'
