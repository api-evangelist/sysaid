openapi: 3.1.0
info:
  title: SysAid REST ActionItems API
  description: 'REST API for SysAid ITSM. Manage service records (incidents, requests, problems, changes), users (agents and end users), groups, companies, assets, configuration items (CIs), templates, attachments, webhooks (beta), and license manager records. Authentication uses Client Credentials to mint short-lived application access tokens. Source: https://developers.sysaid.com/'
  version: '1.0'
  contact:
    name: SysAid
    url: https://developers.sysaid.com/
servers:
- url: https://your-account.sysaidit.com
  description: SysAid tenant base URL (replace your-account)
security:
- BearerAuth: []
tags:
- name: ActionItems
paths:
  /getservicerecordactionitems:
    get:
      tags:
      - ActionItems
      summary: List action items
      operationId: getServiceRecordActionItems
      responses:
        '200':
          description: OK
  /updateservicerecordactionitemstatus:
    put:
      tags:
      - ActionItems
      summary: Update action item status
      operationId: updateServiceRecordActionItemStatus
      responses:
        '200':
          description: OK
  /addadhocactionitem:
    post:
      tags:
      - ActionItems
      summary: Create ad-hoc action item
      operationId: addAdhocActionItem
      responses:
        '201':
          description: Created
  /deleteadhocactionitem:
    delete:
      tags:
      - ActionItems
      summary: Remove action item
      operationId: deleteAdhocActionItem
      responses:
        '204':
          description: Deleted
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'OAuth 2.0 Client Credentials grant: exchange client_id and client_secret at /generateaccesstoken for a short-lived access token (default 24h), then pass as "Authorization: Bearer <token>".'
